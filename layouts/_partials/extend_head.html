{{- /* Pretendard 한글 웹폰트 (CDN) — preconnect로 로드 단축 */ -}}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

{{- /* 네이버 서치어드바이저 소유 확인 — hugo.toml [params]의 naverSiteVerification */ -}}
{{- with site.Params.naverSiteVerification }}
<meta name="naver-site-verification" content="{{ . }}">
{{- end }}

{{- /* 홈 히어로 검색폼 → /search/?q= 값 전달 (fastsearch 로드 후 주입) */ -}}
<script>
    if (window.location.pathname.indexOf('/search/') === 0) {
        window.addEventListener('load', function () {
            setTimeout(function () {
                var q = new URLSearchParams(window.location.search).get('q');
                var input = document.getElementById('searchInput');
                if (q && input) {
                    input.value = q;
                    input.dispatchEvent(new Event('input'));
                }
            }, 200);
        });
    }
</script>
